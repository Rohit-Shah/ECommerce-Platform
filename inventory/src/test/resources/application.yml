spring:
  application:
    name: ets-engine

  datasource:
    url: jdbc:mysql://localhost:3306/ets_engine
    username: root
    password: admin123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${redis_host}
      port: ${redis_port}
      client-name: ETSPlatform
      username: default
      password: ${redis_password}
      timeout: 60s
      connect-timeout: 5s